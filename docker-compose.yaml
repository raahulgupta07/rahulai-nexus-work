# =============================================================================
# CityAgent Insights - Production Docker Compose with Caddy (SSL/HTTPS)
# =============================================================================
#
# Quick Start:
#   1. cp .env.example .env  and fill in the two values marked REQUIRED
#   2. Update Caddyfile with your domain, and set DOMAIN in .env
#   3. Run: docker compose up -d
#
# .env.example is the single description of every setting. The short list that
# used to sit here repeated four of them and disagreed with it on two, so it is
# gone rather than maintained twice.
#
# ★This file is the one that terminates SSL. It differs from
# docker-compose.dev.yaml in two ways worth knowing before you copy commands
# between them:
#
#   * The application is NOT published on a host port. It is reachable only
#     through Caddy on 80/443, so APP_PORT and POSTGRES_PORT in .env do nothing
#     here. `curl localhost:8095` will not answer.
#   * Postgres is not published either, so `psql -h localhost -p 5440` will not
#     connect. Use `docker exec dash-postgres psql -U "$POSTGRES_USER" -d "$POSTGRES_DB"`
#     with the values from your own .env — installations created before the
#     rename hold `bow` / `bagofwords`, newer ones `dash` / `dash_insights`.
#
# For development without SSL, use: docker compose -f docker-compose.dev.yaml up -d
#
# =============================================================================

# ★The project name is declared here so `-p cityagentinsights` never has to be
# typed, and cannot be mistyped or forgotten. Without it Compose names the
# project after the DIRECTORY, so a clone into rahulai-nexus-work produced
# rahulai-nexus-work_postgres_data — a working stack that preflight.sh and
# upgrade.sh could not find, because they discover it by this label. Every
# `docker compose` command in this repository now works from a plain
# `docker compose up -d`.
name: cityagentinsights

services:
  postgres:
    image: postgres:16-alpine
    # ★Overridable so a second stack can be brought up on a machine that
    # already runs one — see the matching note in docker-compose.dev.yaml.
    # Defaults unchanged; nothing needs setting for a normal install.
    container_name: ${DASH_POSTGRES_CONTAINER:-dash-postgres}
    restart: unless-stopped
    environment:
      # ★These are the names a NEW installation is created with. They are only
      # ever applied when Postgres initialises an EMPTY data directory — on an
      # existing install they are inert, and the values already baked into that
      # volume win. So changing them here can never migrate anything; it only
      # decides what the next fresh install is called.
      #
      # Installations created before this change hold `bow` / `bagofwords`,
      # inherited from the upstream project. They keep working untouched: .env
      # pins both names explicitly, and upgrade.sh/preflight.sh now compare
      # .env against what the running database actually reports, so a mismatch
      # is caught before it becomes a connection failure.
      POSTGRES_USER: ${POSTGRES_USER:-dash}
      # ★No default, deliberately. This used to fall back to a literal password
      # that is published in this repository. Left empty the
      # postgres image refuses to initialise and says so plainly, which is the
      # correct outcome for a missing password.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-dash_insights}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dash} -d ${POSTGRES_DB:-dash_insights}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - dash-network

  app:
    # ★★★Build from THIS source tree. Never point this at a public registry.
    # This file previously read `image: <upstream>/<upstream>:latest` with
    # `pull_policy: always`, inherited from the project this was forked from.
    # A production deploy therefore pulled a STRANGER'S image on every start:
    # none of this product's work was in it, it announced itself under the
    # other project's name, and it ran that project's migrations against this
    # product's database. It was found by accidentally running this file — it
    # started cleanly, reported healthy, and served an empty installation.
    image: ${DASH_IMAGE:-cityagentinsights:local}
    build:
      context: .
      dockerfile: Dockerfile
    # ★Belt and braces: `build` makes this image local, and `pull_policy: build`
    # makes fetching one impossible even if someone later re-adds a registry
    # name above. There is no path from this file to a public registry.
    pull_policy: build
    container_name: ${DASH_APP_CONTAINER:-dash-app}
    restart: unless-stopped
    expose:
      - "3000"
    # ★Every key in .env reaches the application, not just the ones listed
    # below. See the matching comment in docker-compose.dev.yaml for why this
    # is a pass-through rather than a hand-maintained list of empty defaults.
    env_file:
      - path: .env
        required: false
    environment:
      - ENVIRONMENT=production
      # Database configuration
      # ★★★The CONTAINER name, not the service name. `postgres` is the compose
      # SERVICE name, and compose gives every service that name as a network
      # alias automatically. That is unambiguous on a private network — and
      # this file defines one — but installs routinely attach these stacks to
      # a shared network so a reverse proxy can reach them, and then a second
      # stack's postgres service claims the SAME alias.
      #
      # Measured on a live host running a prod and a dev stack side by side:
      # `postgres` resolved to two containers with DIFFERENT passwords, Docker
      # round-robined between them, and 11 of 20 connections from production
      # failed with `password authentication failed for user "dash"`. It read
      # as a rotated credential for weeks. It was DNS.
      #
      # The container name is unique per host by construction (Docker refuses
      # a duplicate), so binding to it cannot be ambiguous no matter what
      # network this ends up on. `preflight.sh` also checks for the collision.
      - DASH_DATABASE_URL=postgresql://${POSTGRES_USER:-dash}:${POSTGRES_PASSWORD:-}@${DASH_POSTGRES_CONTAINER:-dash-postgres}:5432/${POSTGRES_DB:-dash_insights}
      # Config path
      - DASH_CONFIG_PATH=/app/dash-config.yaml
      #
      # ★★★DASH_ENCRYPTION_KEY and DASH_LICENSE_KEY used to be listed here as
      # `NAME=${NAME:-}`. Both are plain pass-throughs, so the `env_file` above
      # already delivers them — but writing them here ALSO delivered them when
      # .env does not define them, as an explicit EMPTY STRING, which silently
      # destroyed the old-name fallback and every credential with it. The full
      # account is in docker-compose.dev.yaml; the same reasoning applies here.
    volumes:
      - ./dash-config.yaml:/app/dash-config.yaml:ro
      - uploads_data:/app/backend/uploads
      - branding_data:/app/backend/branding_uploads
      - logs_data:/app/backend/logs
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - dash-network

  caddy:
    image: caddy:2.10-alpine
    container_name: ${DASH_CADDY_CONTAINER:-dash-caddy}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"  # HTTP/3
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    networks:
      - dash-network

volumes:
  postgres_data:
    driver: local
  uploads_data:
    driver: local
  branding_data:
    driver: local
  logs_data:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local

networks:
  dash-network:
    driver: bridge
