# =============================================================================
# CityAgent Insights - Production Docker Compose with Caddy (SSL/HTTPS)
# =============================================================================
#
# Quick Start:
#   1. cp .env.example .env  and fill in the two values marked REQUIRED
#   2. Update Caddyfile with your domain, and set DOMAIN in .env
#   3. Run: docker compose up -d
#
# .env.example is the single description of every setting. The short list that
# used to sit here repeated four of them and disagreed with it on two, so it is
# gone rather than maintained twice.
#
# ★This file is the one that terminates SSL. It differs from
# docker-compose.dev.yaml in two ways worth knowing before you copy commands
# between them:
#
#   * The application is NOT published on a host port. It is reachable only
#     through Caddy on 80/443, so APP_PORT and POSTGRES_PORT in .env do nothing
#     here. `curl localhost:8095` will not answer.
#   * Postgres is not published either, so `psql -h localhost -p 5440` will not
#     connect. Use `docker exec dash-postgres psql -U "$POSTGRES_USER" -d "$POSTGRES_DB"`
#     with the values from your own .env — installations created before the
#     rename hold `bow` / `bagofwords`, newer ones `dash` / `dash_insights`.
#
# For development without SSL, use: docker compose -f docker-compose.dev.yaml up -d
#
# =============================================================================

# ★The project name is declared here so `-p cityagentinsights` never has to be
# typed, and cannot be mistyped or forgotten. Without it Compose names the
# project after the DIRECTORY, so a clone into rahulai-nexus-work produced
# rahulai-nexus-work_postgres_data — a working stack that preflight.sh and
# upgrade.sh could not find, because they discover it by this label. Every
# `docker compose` command in this repository now works from a plain
# `docker compose up -d`.
#
# ★★★And it is OVERRIDABLE, because a host that runs two stacks needs two
# project names. Measured on the live server: prod runs as `cityagentinsights`
# and dev as `cityagentinsights-dev`, and that difference is the ONLY thing
# keeping their volumes apart. Before this line took a variable, the second
# stack got its name by editing this file, which made the file dirty and
# `upgrade.sh` refuse to run — so every upgrade on that host was done by hand.
name: ${DASH_PROJECT_NAME:-cityagentinsights}

services:
  postgres:
    image: postgres:16-alpine
    # ★Overridable so a second stack can be brought up on a machine that
    # already runs one — see the matching note in docker-compose.dev.yaml.
    # Defaults unchanged; nothing needs setting for a normal install.
    container_name: ${DASH_POSTGRES_CONTAINER:-dash-postgres}
    restart: unless-stopped
    environment:
      # ★These are the names a NEW installation is created with. They are only
      # ever applied when Postgres initialises an EMPTY data directory — on an
      # existing install they are inert, and the values already baked into that
      # volume win. So changing them here can never migrate anything; it only
      # decides what the next fresh install is called.
      #
      # Installations created before this change hold `bow` / `bagofwords`,
      # inherited from the upstream project. They keep working untouched: .env
      # pins both names explicitly, and upgrade.sh/preflight.sh now compare
      # .env against what the running database actually reports, so a mismatch
      # is caught before it becomes a connection failure.
      POSTGRES_USER: ${POSTGRES_USER:-dash}
      # ★No default, deliberately. This used to fall back to a literal password
      # that is published in this repository. Left empty the
      # postgres image refuses to initialise and says so plainly, which is the
      # correct outcome for a missing password.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-dash_insights}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dash} -d ${POSTGRES_DB:-dash_insights}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - dash-network

  app:
    # ★★★Build from THIS source tree. Never point this at a public registry.
    # This file previously read `image: <upstream>/<upstream>:latest` with
    # `pull_policy: always`, inherited from the project this was forked from.
    # A production deploy therefore pulled a STRANGER'S image on every start:
    # none of this product's work was in it, it announced itself under the
    # other project's name, and it ran that project's migrations against this
    # product's database. It was found by accidentally running this file — it
    # started cleanly, reported healthy, and served an empty installation.
    image: ${DASH_IMAGE:-cityagentinsights:local}
    build:
      context: .
      dockerfile: Dockerfile
    # ★Belt and braces: `build` makes this image local, and `pull_policy: build`
    # makes fetching one impossible even if someone later re-adds a registry
    # name above. There is no path from this file to a public registry.
    pull_policy: build
    container_name: ${DASH_APP_CONTAINER:-dash-app}
    restart: unless-stopped
    expose:
      - "3000"
    # ★Every key in .env reaches the application, not just the ones listed
    # below. See the matching comment in docker-compose.dev.yaml for why this
    # is a pass-through rather than a hand-maintained list of empty defaults.
    env_file:
      - path: .env
        required: false
    environment:
      - ENVIRONMENT=production
      # Database configuration
      # ★★★The CONTAINER name, not the service name. `postgres` is the compose
      # SERVICE name, and compose gives every service that name as a network
      # alias automatically. That is unambiguous on a private network — and
      # this file defines one — but installs routinely attach these stacks to
      # a shared network so a reverse proxy can reach them, and then a second
      # stack's postgres service claims the SAME alias.
      #
      # Measured on a live host running a prod and a dev stack side by side:
      # `postgres` resolved to two containers with DIFFERENT passwords, Docker
      # round-robined between them, and 11 of 20 connections from production
      # failed with `password authentication failed for user "dash"`. It read
      # as a rotated credential for weeks. It was DNS.
      #
      # ★★★THE DEFAULT IS UNCHANGED ON PURPOSE. Set DASH_POSTGRES_CONTAINER in
      # .env to this stack's own postgres container name and the ambiguity is
      # gone; leave it unset and behaviour is exactly as before.
      #
      # It does NOT default to a container name, and that was a real trap: an
      # installation may run two stacks whose compose files are edited locally
      # so each names its own containers (dash-postgres and
      # dash-postgres-dev). A default baked in here would be right for one of
      # them and point the OTHER at the first one's database — the same fault
      # this is meant to remove, pointed the other way, and silent.
      #
      # So: safe by default, one line to fix, and `preflight.sh` fails loudly
      # if the name in use resolves to more than one container.
      - DASH_DATABASE_URL=postgresql://${POSTGRES_USER:-dash}:${POSTGRES_PASSWORD:-}@${DASH_POSTGRES_CONTAINER:-postgres}:5432/${POSTGRES_DB:-dash_insights}
      # Config path
      - DASH_CONFIG_PATH=/app/dash-config.yaml
      #
      # ★★★DASH_ENCRYPTION_KEY and DASH_LICENSE_KEY used to be listed here as
      # `NAME=${NAME:-}`. Both are plain pass-throughs, so the `env_file` above
      # already delivers them — but writing them here ALSO delivered them when
      # .env does not define them, as an explicit EMPTY STRING, which silently
      # destroyed the old-name fallback and every credential with it. The full
      # account is in docker-compose.dev.yaml; the same reasoning applies here.
    volumes:
      - ./dash-config.yaml:/app/dash-config.yaml:ro
      - uploads_data:/app/backend/uploads
      - branding_data:/app/backend/branding_uploads
      - logs_data:/app/backend/logs
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - dash-network

  # ★★★OFF unless you ask for it: `docker compose --profile caddy up -d`.
  #
  # A service with a profile is not started, not built and not stopped by a
  # plain `up`/`down`, so an installation that terminates SSL somewhere else —
  # nginx-proxy-manager, an ALB, Cloudflare — simply never sees it. Both live
  # servers do exactly that, and both had reached the same state: this service
  # and its two volumes COMMENTED OUT by hand, 26 lines of local edit in a
  # tracked file. Deleting a service to disable it is not a per-install choice
  # anyone should be making in git.
  #
  # ★It still binds 80 and 443 when enabled, so turning it on next to another
  # proxy fails at the port bind — loudly, which is the right way to find out.
  caddy:
    profiles: ["caddy"]
    image: caddy:2.10-alpine
    container_name: ${DASH_CADDY_CONTAINER:-dash-caddy}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"  # HTTP/3
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    networks:
      - dash-network

# =============================================================================
# Volumes
#
# ★★★Each name is pinned explicitly so it can NEVER move by accident. Without a
# `name:`, Compose derives it from the project — so renaming the project
# silently points the stack at a set of fresh, EMPTY volumes. The database is
# then a new installation with none of your data in it, and nothing reports an
# error: Postgres initialises the empty directory and starts up healthy.
#
# The defaults below reproduce exactly what this file rendered before they were
# added (`cityagentinsights_postgres_data` and friends), and they follow a
# renamed project, so a normal install is unaffected either way.
#
# ★The override exists for installs whose volumes are already named something
# else. The live dev stack is one: its volumes carry a `_dev` suffix INSIDE an
# already-`-dev` project (`cityagentinsights-dev_postgres_data_dev`), from an
# era when both stacks shared one project name. That suffix is redundant now
# and must not be "tidied up" — renaming it is the empty-database case above.
# =============================================================================
volumes:
  postgres_data:
    name: ${DASH_POSTGRES_VOLUME:-${DASH_PROJECT_NAME:-cityagentinsights}_postgres_data}
    driver: local
  uploads_data:
    name: ${DASH_UPLOADS_VOLUME:-${DASH_PROJECT_NAME:-cityagentinsights}_uploads_data}
    driver: local
  branding_data:
    name: ${DASH_BRANDING_VOLUME:-${DASH_PROJECT_NAME:-cityagentinsights}_branding_data}
    driver: local
  logs_data:
    name: ${DASH_LOGS_VOLUME:-${DASH_PROJECT_NAME:-cityagentinsights}_logs_data}
    driver: local
  caddy_data:
    name: ${DASH_CADDY_DATA_VOLUME:-${DASH_PROJECT_NAME:-cityagentinsights}_caddy_data}
    driver: local
  caddy_config:
    name: ${DASH_CADDY_CONFIG_VOLUME:-${DASH_PROJECT_NAME:-cityagentinsights}_caddy_config}
    driver: local

# =============================================================================
# Network
#
# ★By default this stack gets its own private bridge, which is what a single
# installation wants and is unchanged from before.
#
# ★★★Set DASH_NETWORK_NAME and DASH_NETWORK_EXTERNAL=true to attach to a
# network something else already created — the usual reason being a reverse
# proxy that has to reach this stack by container name. Both live servers do
# this, and both had achieved it by editing this file.
#
# ★★★A SHARED network is where service-name DNS stops being unambiguous.
# Compose gives every service its own name as a network alias, so two stacks on
# one shared network BOTH answer to `postgres`, and Docker round-robins between
# them. That is not hypothetical: see the DASH_DATABASE_URL note above, where it
# cost weeks of "rotated credential" investigation. If you set these two, set
# DASH_POSTGRES_CONTAINER as well.
# =============================================================================
networks:
  dash-network:
    name: ${DASH_NETWORK_NAME:-${DASH_PROJECT_NAME:-cityagentinsights}_dash-network}
    external: ${DASH_NETWORK_EXTERNAL:-false}
    driver: bridge
