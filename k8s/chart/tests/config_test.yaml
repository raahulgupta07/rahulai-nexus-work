suite: test configmap
templates:
  - config.yaml
release:
  name: test-release
chart:
  appVersion: 0.0.1-test
set:
  postgresql.auth.username: test
  postgresql.auth.password: test
  postgresql.auth.database: testdb
tests:
  - it: renders with default values
    asserts:
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.name
          value: test-release
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: test-release
      - matchRegex:
          path: metadata.labels["helm.sh/chart"]
          pattern: "^cityagent-insights-"
      - matchRegex:
          path: data.DASH_DATABASE_URL
          pattern: "^postgresql://test:test@test-release-postgresql:5432/testdb$"
      - equal:
          path: data.DASH_AUTH_MODE
          value: hybrid
      - equal:
          path: data.DASH_TELEMETRY_ENABLED
          value: "true"

  # ★An operator who writes `enabled: false` for an SSO provider means it.
  # `default true $p.enabled` returned the DEFAULT for a false value — Helm
  # treats false as empty — so a provider that was explicitly switched off
  # rendered as live. `enabled: false` was literally unexpressible.
  - it: honours an explicitly disabled oidc provider
    set:
      config.oidcProviders:
        - name: keycloak
          enabled: false
          issuer: https://kc.example/realms/x
          clientId: cid
          clientSecret: sec
          pkce: false
          discovery: false
    asserts:
      - matchRegex:
          path: data.bowConfig
          pattern: "name: \"keycloak\"\n(?:\\s*#[^\n]*\n)*\\s*enabled: false"
      - matchRegex:
          path: data.bowConfig
          pattern: "pkce: false"
      - matchRegex:
          path: data.bowConfig
          pattern: "discovery: false"

  - it: still defaults an omitted flag to on
    set:
      config.oidcProviders:
        - name: keycloak
          issuer: https://kc.example/realms/x
          clientId: cid
          clientSecret: sec
    asserts:
      - matchRegex:
          path: data.bowConfig
          pattern: "name: \"keycloak\"\n(?:\\s*#[^\n]*\n)*\\s*enabled: true"
      - matchRegex:
          path: data.bowConfig
          pattern: "pkce: true"
      - matchRegex:
          path: data.bowConfig
          pattern: "discovery: true"
