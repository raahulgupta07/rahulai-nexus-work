# Fast dev override — layer ON TOP of docker-compose.dev.yaml:
#   docker compose -p cityagentinsights -f docker-compose.dev.yaml -f docker-compose.dev-fast.yaml up -d app
#
# Mounts host source live into the already-built image (venv stays baked at /opt/venv),
# runs uvicorn with --reload single-worker. Edit any backend .py on the host -> auto-reload
# in ~1s. NO image rebuild. Frontend still served from the baked dist (see notes below).
services:
  app:
    volumes:
      - ./backend:/app/backend           # live backend source
      - ./bow-config.yaml:/app/bow-config.yaml:ro
    # Skip start.sh worker fan-out; run one reloading worker. Migrations run once up-front.
    command:
      - /bin/bash
      - -c
      - >
        cd /app/backend &&
        alembic upgrade head &&
        exec uvicorn main:app --host 0.0.0.0 --port 3000
        --reload --reload-dir /app/backend
        --ws websockets --loop uvloop --http httptools --log-level info
    environment:
      - UVICORN_WORKERS=1
