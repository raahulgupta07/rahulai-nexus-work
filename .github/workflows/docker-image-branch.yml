# Publishes to GHCR under this repository's own account.
#
# ★★★A RELEASE TAG BUILDS AN IMAGE. Without this the repo could produce a
# release that nothing could deploy: every image built on the maintainer's Mac
# is arm64, the servers are x86_64, and this workflow was dispatch-only — so
# 0.0.543.2 was tagged and pushed with no runnable artifact anywhere. Pushing
# `v*` now builds and publishes automatically, so "upgrade" never depends on
# somebody remembering to click a button.
#
# Ordinary pushes to main deliberately do NOT build: a build takes ~20 minutes
# of Actions minutes, and most commits are not releases. The tag is the signal.
#
# ★Builds linux/amd64. Images built on the maintainer's Mac are arm64 and
# CANNOT run on an x86_64 AWS host — that mismatch is the whole reason this
# workflow exists, so do not "simplify" the platform away.
name: Build Branch Docker Image

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
# Original trigger block, preserved so it can be restored if this fork ever
# publishes to its own registry:
# on:
#   workflow_dispatch:
#   issue_comment:
#     types: [created]

permissions:
  contents: read
  packages: write
  security-events: write
  issues: write
  pull-requests: write

jobs:
  authorize:
    # Run on manual dispatch, or on a PR comment starting with `/build-image`
    # from a trusted author (collaborator/member/owner). This keeps random PR
    # commenters from triggering builds on public PRs.
    if: |
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       startsWith(github.event.comment.body, '/build-image') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.resolve.outputs.ref }}
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - name: Resolve ref and SHA
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            REF="${{ github.ref_name }}"
            SHA="${{ github.sha }}"
          else
            PR=$(gh api repos/${{ github.repository }}/pulls/${{ github.event.issue.number }})
            REF=$(echo "$PR" | jq -r .head.ref)
            SHA=$(echo "$PR" | jq -r .head.sha)
          fi
          echo "ref=$REF" >> $GITHUB_OUTPUT
          echo "sha=$SHA" >> $GITHUB_OUTPUT

      - name: React to trigger comment
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X POST \
            repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions \
            -f content='rocket'

  build-and-push:
    needs: authorize
    runs-on: ubuntu-latest
    steps:
      - name: Checkout resolved ref
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.authorize.outputs.sha }}

      - name: Compute image tag
        run: |
          # ★A release tag produces an image named after the VERSION file, so a
          # deployment can pull `<image>:0.0.543.2` — the same string the app
          # reports at /api/changelog and that .env's DASH_IMAGE names. Anything
          # else keeps the branch-and-sha form, which is right for a scratch
          # build and wrong for something people upgrade to.
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION=$(tr -d '[:space:]' < VERSION)
            TAG_VERSION=$(echo "${{ needs.authorize.outputs.ref }}" | sed 's|^v||')
            if [ "$VERSION" != "$TAG_VERSION" ]; then
              echo "::error::tag ${{ needs.authorize.outputs.ref }} does not match VERSION ($VERSION)."
              echo "::error::The image would be named after a release the tree is not."
              exit 1
            fi
            echo "image_tag=${VERSION}" >> $GITHUB_ENV
          else
            SLUG=$(echo "${{ needs.authorize.outputs.ref }}" | sed 's|[/:]|-|g; s|[^A-Za-z0-9._-]|-|g')
            SHORT_SHA=$(echo "${{ needs.authorize.outputs.sha }}" | cut -c1-7)
            echo "image_tag=${SLUG}-${SHORT_SHA}" >> $GITHUB_ENV
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/cityagent-insights" >> $GITHUB_ENV

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet || true
          docker system prune -af --volumes || true
          docker buildx prune -af || true

      - name: Build image (load locally)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ env.image }}:${{ env.image_tag }}

      - name: Trivy scan summary (stdout)
        if: ${{ success() }}
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.image }}:${{ env.image_tag }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: 0

      - name: Scan image with Trivy (SARIF)
        if: ${{ success() }}
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.image }}:${{ env.image_tag }}
          format: sarif
          exit-code: 0
          severity: CRITICAL,HIGH
          output: trivy-results.sarif

      - name: Upload Trivy scan results to GitHub Security tab
        if: ${{ always() && hashFiles('trivy-results.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

      - name: Push Docker image (no :latest)
        if: success()
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          cache-from: type=gha
          tags: ${{ env.image }}:${{ env.image_tag }}

      - name: Say where the image is
        if: success()
        run: |
          {
            echo "### Image published"
            echo ""
            echo '```'
            echo "${{ env.image }}:${{ env.image_tag }}"
            echo '```'
            echo ""
            echo "linux/amd64. To deploy, set DASH_IMAGE to that value and"
            echo "\`docker compose up -d app\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment image tag back on PR
        if: github.event_name == 'issue_comment' && success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X POST \
            repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/comments \
            -f body="Pushed \`${{ env.image }}:${{ env.image_tag }}\`"
