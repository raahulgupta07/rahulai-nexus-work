<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CityAgent Insights Artifact</title>

  <!-- Tailwind CSS -->
  <script src="/libs/tailwindcss-3.4.16.js"></script>

  <!-- React 18 -->
  <!-- ★NO `crossorigin` HERE. This page is loaded into an iframe carrying
       sandbox="allow-scripts" WITHOUT allow-same-origin (see ArtifactFrame.vue),
       so the frame runs at an OPAQUE origin and sends `Origin: null` on every
       request — including requests back to the very server that served it.
       `crossorigin` puts the tag in CORS mode, our own /libs/ responses carry no
       Access-Control-Allow-Origin, and the browser blocks the script outright:
       "React is not defined", every dashboard blank. The attribute only ever
       existed to get readable stack traces out of CDN scripts; these files are
       vendored and served from this same server, so it buys nothing.
       Tailwind/Babel/ECharts below never carried it, which is why only React
       broke. Guarded by tests/unit/fork/test_artifact_sandbox_loads_react.py. -->
  <script src="/libs/react-18.production.min.js"></script>
  <script src="/libs/react-dom-18.production.min.js"></script>

  <!-- Babel Standalone for JSX transpilation -->
  <script src="/libs/babel-standalone.min.js"></script>

  <!-- ECharts 5 -->
  <script src="/libs/echarts-5.min.js"></script>

  <!-- PDF.js — listed in libs/manifest.json like every other page library -->
  <script src="/libs/pdf.min.js"></script>

  <!-- ★The shared artifact helpers. This file is the ONE source of
       window.KPICard, DataTable, useFilters, fmt, EChart and the rest;
       this shell used to carry its own stale copy. -->
  <script src="/libs/artifact-globals.js"></script>

  <style>
    html, body, #root {
      height: 100%;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    /* Global loading overlay */
    #global-loader {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff;
      color: #9ca3af;
      z-index: 9999;
      transition: opacity 0.2s ease-out;
    }
    #global-loader.hidden {
      opacity: 0;
      pointer-events: none;
    }
    /* Loading state */
    .artifact-loading {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: #9ca3af;
    }
    .artifact-error {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: #ef4444;
      padding: 1rem;
      text-align: center;
    }
  </style>
</head>
<body>
  <!-- Global loading overlay - shown until data is received -->
  <div id="global-loader">
    <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24">
      <path fill="currentColor" d="M12 2A10 10 0 1 0 22 12A10 10 0 0 0 12 2Zm0 18a8 8 0 1 1 8-8A8 8 0 0 1 12 20Z" opacity=".5"/>
      <path fill="currentColor" d="M20 12h2A10 10 0 0 0 12 2V4A8 8 0 0 1 20 12Z">
        <animateTransform attributeName="transform" dur="1s" from="0 12 12" repeatCount="indefinite" to="360 12 12" type="rotate"/>
      </path>
    </svg>
  </div>

  <div id="root"></div>

  <script>
    // ===========================================
    // Dash Artifact Runtime - Data Bridge
    // ===========================================

    (function() {
      'use strict';

      // Store for artifact data received from parent (preserve if already injected for headless rendering)
      if (!window.ARTIFACT_DATA) {
        window.ARTIFACT_DATA = null;
      }
      window.ARTIFACT_READY = false;

      // Listen for data from parent window
      window.addEventListener('message', function(event) {
        // Only accept messages from the embedding document. 'null' covers
        // srcdoc / data: framings where the parent reports an opaque origin.
        if (event.origin !== window.location.origin && event.origin !== 'null') {
          return;
        }
        // Handle data payload
        if (event.data && event.data.type === 'ARTIFACT_DATA') {
          window.ARTIFACT_DATA = event.data.payload;

          // Hide global loader
          var loader = document.getElementById('global-loader');
          if (loader) {
            loader.classList.add('hidden');
          }

          // Dispatch custom event for React components to listen to
          window.dispatchEvent(new CustomEvent('artifactdata', {
            detail: event.data.payload
          }));

          console.log('[Artifact] Received data:', Object.keys(event.data.payload));
        }
      });

      // Signal to parent that iframe is ready to receive data
      window.ARTIFACT_READY = true;

      try {
        window.parent.postMessage({ type: 'ARTIFACT_READY' }, '*');
        console.log('[Artifact] Ready signal sent to parent');
      } catch (e) {
        console.error('[Artifact] Failed to send ready signal:', e);
      }

      // ★This shell defines exactly ONE artifact global of its own, and only
      //  because its data arrives by postMessage AFTER the document has loaded:
      //  useArtifactData must be a React hook that subscribes to the
      //  `artifactdata` event. Every other renderer sets window.ARTIFACT_DATA
      //  before the artifact code runs, where the plain getter in
      //  artifact-globals.js is correct. Swapping one for the other renders an
      //  empty dashboard, so the override stays — and is allowlisted in
      //  backend/tests/unit/fork/test_every_artifact_renderer_agrees.py.
      //
      //  Everything else this block used to hold — LoadingSpinner, fmt,
      //  CustomTooltip, KPICard, SectionCard, FilterSelect, the React hook
      //  aliases, the dash ECharts theme and the EChart wrapper — was a COPY of
      //  /libs/artifact-globals.js that had fallen 18 symbols behind it,
      //  missing DataTable, useFilters, BowKpi, exportCSV, InfoPopover,
      //  FilterSearch, BowFitText and resizeAllCharts. It is loaded from the
      //  real file in <head> now.
      window.useArtifactData = function() {
        var ref = React.useState(window.ARTIFACT_DATA);
        var data = ref[0];
        var setData = ref[1];

        React.useEffect(function() {
          var handler = function(e) { setData(e.detail); };
          window.addEventListener('artifactdata', handler);
          // ★Covers the race where the payload arrived between first render
          // and this effect: the event has already fired and will not fire
          // again, so the dashboard would sit on the loader forever.
          if (window.ARTIFACT_DATA && !data) setData(window.ARTIFACT_DATA);
          return function() { window.removeEventListener('artifactdata', handler); };
        }, []);

        return data;
      };

      // Error handler for uncaught errors
      window.onerror = function(msg, url, lineNo, columnNo, error) {
        console.error('[Artifact Error]', msg, error);
        var root = document.getElementById('root');
        if (root) {
          root.innerHTML = '<div class="artifact-error"><div><strong>Error:</strong><br>' +
            (msg || 'Unknown error') + '</div></div>';
        }
        return false;
      };

    })();
  </script>

  <!-- LLM_GENERATED_CODE -->
</body>
</html>
