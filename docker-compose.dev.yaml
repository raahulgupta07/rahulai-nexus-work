# =============================================================================
# CityAgent Insights - Development Docker Compose (no SSL)
# =============================================================================
#
# Quick Start:
#   1. Create a .env file with your configuration (see below)
#   2. Run: docker compose -f docker-compose.dev.yaml up -d
#
# .env.example is the single description of every setting. The short list that
# used to sit here repeated seven of them and had already drifted on three, so
# it is gone rather than maintained twice.
#
#   cp .env.example .env
#
# =============================================================================

# ★The project name is declared here so `-p cityagentinsights` never has to be
# typed, and cannot be mistyped or forgotten. Without it Compose names the
# project after the DIRECTORY, so a clone into rahulai-nexus-work produced
# rahulai-nexus-work_postgres_data — a working stack that preflight.sh and
# upgrade.sh could not find, because they discover it by this label. Every
# `docker compose` command in this repository now works from a plain
# `docker compose up -d`.
name: cityagentinsights

services:
  postgres:
    image: postgres:16-alpine
    # ★Overridable so a second stack can be brought up on a machine that
    # already runs one. The container names and the image tag are FIXED
    # strings, so a rehearsal, a staging copy or a support reproduction built
    # from a second checkout does not create its own stack — it renames the
    # running containers onto its own build and rebuilds over the very image
    # tag the live application is being served from, which containerd then
    # collects. Defaults are unchanged; nothing needs setting for a normal
    # install.
    container_name: ${DASH_POSTGRES_CONTAINER:-dash-postgres}
    restart: unless-stopped
    environment:
      # ★These are the names a NEW installation is created with. They are only
      # ever applied when Postgres initialises an EMPTY data directory — on an
      # existing install they are inert, and the values already baked into that
      # volume win. So changing them here can never migrate anything; it only
      # decides what the next fresh install is called.
      #
      # Installations created before this change hold `bow` / `bagofwords`,
      # inherited from the upstream project. They keep working untouched: .env
      # pins both names explicitly, and upgrade.sh/preflight.sh now compare
      # .env against what the running database actually reports, so a mismatch
      # is caught before it becomes a connection failure.
      POSTGRES_USER: ${POSTGRES_USER:-dash}
      # ★No default, deliberately. This used to fall back to the literal string
      # 'bowpassword', which is published in this repository, on a port mapped
      # to the host. Left empty the postgres image refuses to initialise and
      # says so plainly, which is the correct outcome for a missing password.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-dash_insights}
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dash} -d ${POSTGRES_DB:-dash_insights}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - dash-network-dev

  app:
    image: ${DASH_IMAGE:-cityagentinsights:local}
    # ★This image is built here from source and exists in no registry, so any
    # attempt to fetch it must be refused rather than attempted. Under a policy
    # of `always`, every `up -d` opens with a failed pull:
    #   "pull access denied for cityagentinsights, repository does not exist"
    # Compose then falls back to the local image and the command succeeds — so
    # it is only noise, but it is noise shaped exactly like a failure, printed
    # in the middle of the one command an operator is watching.
    # (The base file no longer sets `always`; it builds from source too. This
    # stays as an independent guarantee rather than an inherited one.)
    pull_policy: never
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${DASH_APP_CONTAINER:-dash-app}
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    # ★Every key in .env reaches the application, not just the ones listed
    # below. Most settings this code reads — the model provider, email, Entra
    # sign-on, the AWS database options, scheduler and concurrency tuning — had
    # no line here, so setting them in .env did nothing at all, silently.
    #
    # Deliberately NOT a hand-maintained list of `FOO=${FOO:-}` lines. An empty
    # default is not the same as an absent variable: `FRONTEND_DIST_DIR` reads
    # `os.environ.get(..., "/app/frontend/dist")`, so passing it through empty
    # resolves the dist path to the working directory and the app dies at
    # startup with a missing index.html. Verified: a key in neither .env nor
    # the list below stays genuinely unset, so code defaults survive.
    #
    # `environment:` still wins over this file, which is why the explicit
    # entries below keep their documented defaults.
    env_file:
      - path: .env
        required: false
    environment:
      - ENVIRONMENT=production
      # Database configuration
      - DASH_DATABASE_URL=postgresql://${POSTGRES_USER:-dash}:${POSTGRES_PASSWORD:-}@postgres:5432/${POSTGRES_DB:-dash_insights}
      # Config path
      - DASH_CONFIG_PATH=/app/dash-config.yaml
      #
      # ★★★DASH_ENCRYPTION_KEY and DASH_LICENSE_KEY used to be listed here as
      # `NAME=${NAME:-}`. Both are plain pass-throughs, so the `env_file` above
      # already delivers them — but writing them here ALSO delivered them when
      # .env does not define them, as an explicit EMPTY STRING.
      #
      # That empty string is not harmless. An installation upgrading from
      # before the rename carries the key under its previous name
      # (BOW_ENCRYPTION_KEY). app/settings/env_compat.py exists to accept that
      # spelling — and it decided the new name was already supplied, because
      # "" is not None. The old key was never read, and config.py generated a
      # fresh one: every stored connector password, Microsoft token, directory
      # bind and single sign-on secret becomes permanently unreadable, while
      # start-up reports healthy. Proved against the built image, both ways:
      #
      #   this line present  ->  mirrored: []                   old key LOST
      #   this line removed  ->  mirrored: [BOW_ENCRYPTION_KEY]  old key KEPT
      #
      # env_compat now treats an empty value as absent, so the fallback would
      # survive even if these lines came back. They are still gone, because a
      # variable that is only ever passed straight through belongs in exactly
      # one place.
      #
      # ★Sixteen feature-flag lines used to sit here, each repeating a default
      # that backend/app/settings/config.py already declares. Two of them
      # DISAGREED with the code, and compose wins — an explicit environment
      # entry is passed to the container, so `os.environ.get(NAME, default)`
      # never sees its own default:
      #
      #   HYBRID_FABRIC_USER        code true, compose false
      #     The code comment says "Default TRUE - this whitelabel seeds a
      #     Fabric agent on install and wants the connector always visible".
      #     Compose hid it. A fresh install therefore seeded a Fabric agent
      #     and then left the connector out of the catalogue.
      #
      #   HYBRID_DECK_LAYOUT_CHECK  code false, compose true
      #     Every deployment has run the check since it shipped, while both
      #     config.py and test_pptx_layout_check.test_flag_defaults_off said
      #     it was off ("Phase 1 ships dark. Turning this on is a separate,
      #     deliberate act."). The documented default now wins; set it in
      #     .env to keep the check running.
      #
      # The flags are gone from here entirely. config.py owns every default,
      # and the `env_file` above carries any override the operator sets, so
      # nothing is lost — there is simply one source of truth instead of two.
    volumes:
      - ./dash-config.yaml:/app/dash-config.yaml:ro
      - uploads_data_dev:/app/backend/uploads
      - branding_data_dev:/app/backend/branding_uploads
      - logs_data_dev:/app/backend/logs
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - dash-network-dev

volumes:
  postgres_data_dev:
    driver: local
  uploads_data_dev:
    driver: local
  branding_data_dev:
    driver: local
  logs_data_dev:
    driver: local

networks:
  dash-network-dev:
    driver: bridge
